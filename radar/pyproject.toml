[project]
name = "radar"
version = "0.1.0"
description = "Nyhetsovervåking for utdanningsfeltet — barnehage til lærerutdanning"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=46",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=3.0.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
radar-fetch = "radar.cli:fetch"
radar-tick = "radar.cli:tick"
radar-reclassify = "radar.cli:reclassify"
radar-recluster = "radar.cli:recluster"
radar-coverage = "radar.cli:recover"
radar-prune = "radar.cli:prune"
radar-backup = "radar.cli:backup"
radar-doctor = "radar.cli:doctor"
radar-web = "radar.web.app:dev"

[project.optional-dependencies]
rss = [
    "feedparser>=6.0.14",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Vendored verbatim; never edited in this repo.
"src/radar/usage_client.py" = ["C408"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # There has been a [tool.ruff] block and a .ruff_cache in here for months
    # with nothing that installs ruff. Declared so `uv run ruff check` works
    # from a fresh checkout.
    "ruff>=0.16",
    # tests/test_feeds.py imports the optional RSS reader.
    "radar[rss]",
]

# Supply-chain cooldown: resolve only releases at least 7 days old. Set in the repo, not only in
# ~/.config/uv/uv.toml, so every machine and CI write and check the same uv.lock.
[tool.uv]
exclude-newer = "7 days"
