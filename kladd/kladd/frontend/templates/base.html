<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong theme.
      (function(){
        try {
          var t = localStorage.getItem('theme') || 'system';
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          else document.documentElement.removeAttribute('data-theme');
        } catch (e) {}
      })();
    </script>
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css?v=12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script src="/static/marked.min.js"></script>
    <script src="/static/purify.min.js"></script>
</head>
<body>
    <div class="page">
        <header>
            <h1 class="logo"><a href="/">{{ app_name }}</a></h1>
            <p class="tagline">{{ tagline }}</p>
            <div class="header-actions">
                <a class="nav-link" href="/drafts">Historikk</a>
                {% if request.state.is_admin %}<a class="nav-link" href="/rules">Regler</a>{% endif %}
                <div class="theme-toggle" role="radiogroup" aria-label="Tema">
                    <button type="button" class="theme-toggle-btn" data-theme-set="system" aria-label="Følg systemtema" title="Følg system">
                        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="3" width="12" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 14h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    </button>
                    <button type="button" class="theme-toggle-btn" data-theme-set="light" aria-label="Lyst tema" title="Lyst">
                        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M3.3 12.7l1.1-1.1M11.6 4.4l1.1-1.1"/></g></svg>
                    </button>
                    <button type="button" class="theme-toggle-btn" data-theme-set="dark" aria-label="Mørkt tema" title="Mørkt">
                        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 9.5A6 6 0 0 1 6.5 3a.5.5 0 0 0-.7-.5A6.5 6.5 0 1 0 13.5 10.2a.5.5 0 0 0-.5-.7Z" fill="currentColor"/></svg>
                    </button>
                </div>
            </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
<script>
// All markdown (LLM output, external source content) passes through DOMPurify
// before hitting the DOM — marked lets raw HTML through otherwise.
function renderMarkdown(md) {
    return DOMPurify.sanitize(marked.parse(md || ""));
}

function copyArticle(btn) {
    var el = document.getElementById("article-output");
    var md = el.dataset.markdown;
    function flash() {
        btn.querySelector('.icon-copy').style.display = 'none';
        btn.querySelector('.icon-check').style.display = '';
        btn.querySelector('.copy-label').textContent = 'Kopiert!';
        setTimeout(function() {
            btn.querySelector('.icon-copy').style.display = '';
            btn.querySelector('.icon-check').style.display = 'none';
            btn.querySelector('.copy-label').textContent = 'Kopier';
        }, 2000);
    }
    // Rich copy: text/html so paste into a CMS keeps title/bold/links,
    // text/plain carries the markdown. Fallback: markdown only.
    if (navigator.clipboard.write && window.ClipboardItem) {
        var item = new ClipboardItem({
            "text/html": new Blob([renderMarkdown(md)], { type: "text/html" }),
            "text/plain": new Blob([md], { type: "text/plain" })
        });
        navigator.clipboard.write([item]).then(flash, function() {
            navigator.clipboard.writeText(md).then(flash);
        });
    } else {
        navigator.clipboard.writeText(md).then(flash);
    }
}
</script>
<script>
// Theme toggle: apply saved choice, reflect active button, persist selection.
(function(){
    var saved = (function(){ try { return localStorage.getItem('theme') || 'system'; } catch(e){ return 'system'; } })();
    var btns = document.querySelectorAll('[data-theme-set]');
    function apply(t){
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        else document.documentElement.removeAttribute('data-theme');
        btns.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.themeSet === t ? 'true' : 'false'); });
        try { localStorage.setItem('theme', t); } catch(e){}
    }
    apply(saved);
    btns.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.themeSet); }); });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
