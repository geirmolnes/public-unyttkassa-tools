[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kladd"
version = "0.1.0"
description = "Norwegian news article drafter from source material"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.129.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "pydantic-ai>=1.23.0",
    "google-genai>=1.0.0",
    "unytt-parser",
    "unytt-editorial",
    "uvicorn[standard]>=0.41.0",
    "cryptography>=46",
]

# Supply-chain cooldown: resolve only releases at least 7 days old. Set in the repo, not only in
# ~/.config/uv/uv.toml, so every machine and CI write and check the same uv.lock.
[tool.uv]
exclude-newer = "7 days"

# Shared libs, kept in libs/ so their rules and parsers can be edited in place.
[tool.uv.sources]
unytt-parser = { path = "libs/unytt_parser", editable = true }
unytt-editorial = { path = "libs/unytt_editorial", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
kladd = "kladd.frontend.server:main"
kladd-draft = "kladd.main:main"
