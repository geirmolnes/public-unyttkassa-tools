{% extends "base.html" %}

{% block main %}
<header class="page-header">
    <h1>Ny transkripsjon</h1>
    <p class="tagline">Last opp en lydfil og få en tekst med klikkbare tidsstempler.</p>
</header>

<section id="upload-view">
    <label for="file-input" class="dropzone" id="dropzone" data-max-mb="{{ max_upload_mb }}" data-max-label="{{ max_upload_label }}">
        <input type="file" id="file-input" accept="audio/*,.m4a,.mp4,.ogg,.flac,.aac,.aiff,.wav,.mp3" hidden>
        <div class="dropzone-content">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M12 3v14m0 0l-5-5m5 5l5-5M5 21h14"/>
            </svg>
            <p class="dz-line dz-pointer"><strong>Dra og slipp</strong> en lydfil her, eller klikk for å velge</p>
            <p class="dz-line dz-touch"><strong>Trykk for å velge</strong> en lydfil</p>
            <p class="hint">MP3 · WAV · M4A · OGG · FLAC · opptil {{ max_upload_label }}</p>
        </div>
    </label>
    <div id="upload-error" class="error hidden"></div>
</section>

<section id="progress-view" class="hidden">
    <div class="card">
        <p class="progress-filename" id="progress-filename"></p>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
        <div class="progress-row">
            <p id="progress-text">Laster opp...</p>
            <p id="progress-eta" class="progress-eta"></p>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/app.js?v={{ asset_version }}"></script>
{% endblock %}
