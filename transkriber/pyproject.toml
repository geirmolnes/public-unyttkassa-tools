[project]
name = "unytt-transkriber"
version = "0.1.0"
description = "Journalist transcription tool powered by ElevenLabs Scribe"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-genai>=1.0.0",
    "pydantic-ai-slim[google]>=0.0.50",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
    "httpx>=0.28.1",
    "python-docx>=1.2.0",
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008 flags FastAPI's Depends()/File() in defaults, which is the idiomatic pattern.
extend-ignore = ["B008"]

# Supply-chain cooldown: resolve only releases at least 7 days old. Set in the repo, not only in
# ~/.config/uv/uv.toml, so every machine and CI write and check the same uv.lock.
[tool.uv]
exclude-newer = "7 days"
